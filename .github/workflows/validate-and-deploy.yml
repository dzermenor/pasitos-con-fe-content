name: Validate and deploy content

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate stories
        run: python scripts/validate_content.py

  # One Pages site serves both branches: main at the root (released app)
  # and develop under /dev/ (debug app, for reviewing stories before release).
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    # Every deploy publishes both branches, so the newest run can replace an older one.
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: develop
      - uses: actions/configure-pages@v6
      - name: Prepare public content
        run: |
          publish() {
            mkdir -p "$2"
            cp "$1/catalog.json" "$2/catalog.json"
            cp -R "$1/stories" "$2/stories"
            if [ -d "$1/images" ]; then cp -R "$1/images" "$2/images"; fi
          }
          publish main _site
          publish develop _site/dev
          cp -R main/privacidad _site/privacidad
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
